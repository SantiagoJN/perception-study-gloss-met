<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A visual perception study of glossiness and metallicness."
    />
    <script>
      // Keep assets rooted at the study for direct and nested anonymous routes.
      const routeParts = location.pathname.replace(/\/+$/, '').split('/');
      const route = routeParts[routeParts.length - 1];
      if (['preview', 'testing', 'inhouse', 'test1_pair_comparison', 'test2_2afc', 'test3_matching', 'test4_mm'].includes(route)) {
        const base = document.createElement('base');
        const anonymousRoute = routeParts[routeParts.length - 2] === 'anon';
        const relativeBase = anonymousRoute
          ? (location.pathname.endsWith('/') ? '../../' : '../')
          : (location.pathname.endsWith('/') ? '../' : './');
        base.href = new URL(relativeBase, location.href).href;
        document.head.appendChild(base);
      }
    </script>
    <title>User study</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="%BASE_URL%config.js?v=__DEPLOYMENT_VERSION__"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
