name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow websocket-client
      - run: npm run lint
      - run: npm run test:worker
      - run: npm run test:assets:ci
      - run: npm run build
      - run: npm run test:e2e
      - run: npm run test:e2e:routes
      - name: Add runtime study configuration
        env:
          STIMULUS_BASE_URL: ${{ vars.STIMULUS_BASE_URL }}
          STUDY_API_BASE_URL: https://perception-study-api.bunnysantiago.workers.dev
        run: |
          test -n "$STIMULUS_BASE_URL" || { echo "STIMULUS_BASE_URL is required for anonymous R2 stimuli" >&2; exit 1; }
          case "$STIMULUS_BASE_URL" in *r2.dev*) echo "STIMULUS_BASE_URL must use the production R2 custom domain, not r2.dev" >&2; exit 1;; esac
          test -n "$STUDY_API_BASE_URL" || { echo "STUDY_API_BASE_URL is required for response submission" >&2; exit 1; }
          node --input-type=module -e "import fs from 'node:fs'; const config = { stimulusBaseUrl: process.env.STIMULUS_BASE_URL ?? '', apiBaseUrl: process.env.STUDY_API_BASE_URL ?? '', deploymentVersion: process.env.GITHUB_SHA ?? '' }; fs.writeFileSync('dist/config.js', 'window.USER_STUDY_CONFIG = ' + JSON.stringify(config) + ';\\n');"
      - run: npm run sanitize:deployment
      - run: npm run test:deployment
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
