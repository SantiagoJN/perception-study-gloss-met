name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Add runtime study configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          STIMULUS_BASE_URL: ${{ secrets.STIMULUS_BASE_URL }}
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const config = { supabaseUrl: process.env.SUPABASE_URL ?? '', supabasePublishableKey: process.env.SUPABASE_PUBLISHABLE_KEY ?? '', stimulusBaseUrl: process.env.STIMULUS_BASE_URL ?? '' }; fs.writeFileSync('dist/config.js', 'window.USER_STUDY_CONFIG = ' + JSON.stringify(config) + ';\\n');"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
